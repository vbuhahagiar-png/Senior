[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "10MiB"

[storage.buckets.avatars]
public = true
file_size_limit = "5MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]

[storage.buckets.letters]
public = false
file_size_limit = "10MiB"
allowed_mime_types = ["image/jpeg", "image/png", "application/pdf"]

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = [
  "https://seniorplus.ch",
  "https://app.seniorplus.ch",
  "seniorplus://",
  "exp://localhost:8081"
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1s"

[auth.email.smtp]
enabled = true
host = "inbucket"
port = 2500
admin_email = "admin@seniorplus.ch"
sender_name = "Senior +"

[analytics]
enabled = false

[experimental]
orioledb_version = ""
